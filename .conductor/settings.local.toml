"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# npm + committed package-lock.json. `ci` is reproducible and never rewrites the
# lockfile, so a new workspace doesn't start with a dirty git status.
setup = "npm ci --no-audit --no-fund"

# Frees the ~100k files in node_modules before Conductor removes the worktree.
# Everything it deletes is regenerated by scripts.setup.
archive = "rm -rf .next node_modules"

# Every workspace binds its own $CONDUCTOR_PORT and the app has no database,
# Docker stack, or other shared local resource.
run_mode = "concurrent"

[scripts.run.dev]
command = "npm run dev -- --port $CONDUCTOR_PORT"
default = true
icon = "play"

[scripts.run.build]
command = "npm run build"
icon = "package"

[scripts.run.preview]
command = "npm run build && npm run start -- --port $CONDUCTOR_PORT"
icon = "rocket"
